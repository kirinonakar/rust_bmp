[package]
name = "rust_bmp"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "1.9.0", features = ["raw-window-handle-06"] }
image = "0.25.1"
anyhow = "1.0"
byteorder = "1.5"

rfd = "0.14"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.9.0"
winresource = "0.1"

[profile.release]
opt-level = "z"      # 크기 최적화 (s 또는 z)
lto = true           # Link Time Optimization: 미사용 코드 제거
codegen-units = 1    # 병렬 컴파일을 제한하여 최적화 기회 극대화
panic = "abort"      # 패닉 발생 시 스택 추적 정보 제거
strip = true         # 심볼 정보 및 디버그 정보 강제 제거
